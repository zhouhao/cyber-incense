<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赛博敲木鱼 - Cyber Woodfish</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Woodfish container */
    .woodfish-wrapper {
      position: relative;
      width: 400px;
      height: 300px;
      margin: 2rem auto;
    }

    /* Woodfish body SVG */
    .woodfish-body {
      width: 100%;
      height: 100%;
      cursor: pointer;
      transition: transform 0.05s ease;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.4));
    }

    .woodfish-body:active {
      transform: scale(0.98);
    }

    .woodfish-body.shake {
      animation: woodfishShake 0.15s ease-out;
    }

    @keyframes woodfishShake {
      0% { transform: translateX(0) rotate(0); }
      25% { transform: translateX(-3px) rotate(-1deg); }
      75% { transform: translateX(3px) rotate(1deg); }
      100% { transform: translateX(0) rotate(0); }
    }

    /* Hit flash effect on the slit */
    .woodfish-body.hit::after {
      content: '';
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 30px;
      background: radial-gradient(ellipse, rgba(255, 215, 0, 0.8) 0%, transparent 70%);
      animation: hitFlash 0.2s ease-out forwards;
      pointer-events: none;
    }

    @keyframes hitFlash {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
    }

    /* Mallet (木鱼棒) */
    .mallet {
      position: absolute;
      top: -20px;
      right: 20px;
      width: 80px;
      height: 280px;
      opacity: 0;
      transform: rotate(-45deg) scale(0.8);
      transform-origin: bottom center;
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      z-index: 10;
    }

    .woodfish-wrapper:hover .mallet,
    .mallet.visible {
      opacity: 1;
      transform: rotate(-20deg) scale(1);
    }

    /* Mallet strike animation */
    .mallet.striking {
      animation: malletStrike 0.25s ease-out;
    }

    @keyframes malletStrike {
      0% { transform: rotate(-20deg) scale(1); }
      40% { transform: rotate(45deg) scale(1.1) translateY(-10px); }
      70% { transform: rotate(35deg) scale(1.05); }
      100% { transform: rotate(-20deg) scale(1); }
    }

    /* Ripple effect on woodfish */
    .ripple {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 40px;
      border: 2px solid rgba(255, 215, 0, 0.6);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }

    .ripple.active {
      animation: rippleEffect 0.5s ease-out;
    }

    @keyframes rippleEffect {
      0% {
        width: 80px;
        height: 40px;
        opacity: 0.8;
      }
      100% {
        width: 300px;
        height: 150px;
        opacity: 0;
      }
    }

    /* Tap count selector */
    

    /* Quick tap button */
    .quick-tap-btn {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(145deg, #3a2a1a, #2a1a0a);
      border: 3px solid #ffd700;
      color: #ffd700;
      font-family: var(--font-heading);
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      transition: all 0.1s ease;
      z-index: 50;
    }

    .quick-tap-btn:active {
      transform: scale(0.9);
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.8);
    }

    /* Combo display */
    .combo-display {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--font-heading);
      font-size: 4rem;
      color: #ffd700;
      text-shadow:
        0 0 20px #ffd700,
        0 0 40px #ffd700;
      pointer-events: none;
      opacity: 0;
      z-index: 100;
    }

    .combo-display.show {
      animation: comboAnim 0.8s ease-out;
    }

    @keyframes comboAnim {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.5);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.2);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.5) translateY(-50px);
      }
    }

    /* Merit float animation */
    .merit-float {
      position: absolute;
      font-family: var(--font-mono);
      font-size: 1.5rem;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
      pointer-events: none;
      animation: floatUp 1s ease-out forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(-100px);
      }
    }

    /* Stats display */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin: 2rem 0;
    }

    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid rgba(255, 215, 0, 0.3);
      padding: 1.5rem;
      text-align: center;
      border-radius: 4px;
    }

    .stat-value {
      font-family: var(--font-mono);
      font-size: 2.5rem;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Progress to 108 */
    .progress-container {
      width: 100%;
      max-width: 400px;
      margin: 1rem auto;
    }

    .progress-bar {
      height: 8px;
      background: rgba(255, 215, 0, 0.2);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #ffd700, #ff6600);
      border-radius: 4px;
      transition: width 0.3s ease;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .progress-label {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 0.5rem;
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>
  <!-- Combo display -->
  <div id="combo-display" class="combo-display"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="logo">
      <span class="logo-icon">🔥</span>
      <span class="logo-text glitch">赛博上香</span>
    </a>
    <div class="nav-links">
      <a href="/burn" class="nav-link">上香</a>
      <a href="/woodfish" class="nav-link" style="color: var(--color-gold);">敲木鱼</a>
      <div id="nav-user"></div>
    </div>
  </nav>

  <!-- Main Content -->
  <main style="padding-top: 80px; min-height: 100vh;">
    <!-- Login Required -->
    <div id="login-required" style="display: none; text-align: center; padding: 4rem 2rem;">
      <h2 style="color: var(--color-gold); font-family: var(--font-heading); margin-bottom: 1rem;">请先登录</h2>
      <p style="color: var(--text-muted); margin-bottom: 2rem;">敲击木鱼需要你的灵魂在场</p>
      <a href="/auth" class="btn btn-gold">登录 / 注册</a>
    </div>

    <!-- Woodfish Interface -->
    <div id="woodfish-interface" style="display: none;">
      <div class="container" style="max-width: 800px; text-align: center;">
        <!-- Title -->
        <h1 style="color: var(--color-gold); font-family: var(--font-heading); font-size: 2rem; margin-bottom: 0.5rem;">
          赛博敲木鱼
        </h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">
          CYBER WOODFISH // 积德消业 // 赛博修行
        </p>

        

        <!-- Progress to 108 -->
        <div class="progress-container">
          <div class="progress-bar">
            <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
          </div>
          <div class="progress-label">
            本轮进度: <span id="current-progress">0</span> / 108
          </div>
        </div>

        <!-- Woodfish -->
        <div class="woodfish-wrapper" id="woodfish-wrapper">
          <!-- Woodfish Body SVG -->
          <svg class="woodfish-body" id="woodfish-body" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#D4A574"/>
                <stop offset="30%" style="stop-color:#C49A6C"/>
                <stop offset="70%" style="stop-color:#A67C52"/>
                <stop offset="100%" style="stop-color:#8B6914"/>
              </linearGradient>
              <linearGradient id="woodHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#E8C9A0"/>
                <stop offset="100%" style="stop-color:#C49A6C"/>
              </linearGradient>
              <linearGradient id="slitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#2D1B0E"/>
                <stop offset="100%" style="stop-color:#1A0F06"/>
              </linearGradient>
              <filter id="woodShadow">
                <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
              </filter>
              <filter id="innerShadow">
                <feComponentTransfer in="SourceAlpha">
                  <feFuncA type="table" tableValues="1 0"/>
                </feComponentTransfer>
                <feGaussianBlur stdDeviation="3"/>
                <feOffset dx="0" dy="2" result="offsetblur"/>
                <feFlood flood-color="#2D1B0E" flood-opacity="0.5"/>
                <feComposite in2="offsetblur" operator="in"/>
                <feMerge>
                  <feMergeNode/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <!-- Main woodfish body - teardrop/bulbous shape -->
            <path d="M 60 150
                     Q 50 100 100 70
                     Q 150 40 220 50
                     Q 280 60 320 100
                     Q 360 140 350 180
                     Q 340 220 280 230
                     Q 220 240 160 220
                     Q 100 200 60 150 Z"
                  fill="url(#woodGrad)"
                  filter="url(#woodShadow)"/>

            <!-- Highlight on top -->
            <ellipse cx="180" cy="90" rx="80" ry="30" fill="url(#woodHighlight)" opacity="0.4"/>

            <!-- Wood grain texture -->
            <g stroke="#8B6914" stroke-width="0.5" opacity="0.2">
              <path d="M 80 140 Q 120 100 160 90 Q 200 80 250 85 Q 300 90 330 120"/>
              <path d="M 70 160 Q 110 120 150 110 Q 190 100 240 105 Q 290 110 340 150"/>
              <path d="M 65 180 Q 100 140 140 130 Q 180 120 230 125 Q 280 130 335 170"/>
              <path d="M 70 200 Q 105 160 145 150 Q 185 140 235 145 Q 285 150 330 190"/>
            </g>

            <!-- The horizontal slit (resonance chamber) -->
            <path d="M 100 145
                     Q 150 130 200 135
                     Q 260 140 310 150
                     Q 340 160 350 175
                     Q 340 190 310 195
                     Q 260 200 200 195
                     Q 150 190 100 180
                     Q 80 170 80 160
                     Q 85 145 100 145 Z"
                  fill="url(#slitGrad)"
                  filter="url(#innerShadow)"/>

            <!-- Slit highlight (inner reflection) -->
            <path d="M 110 148 Q 160 135 210 140 Q 270 148 330 158"
                  fill="none"
                  stroke="#5D4037"
                  stroke-width="2"
                  opacity="0.6"/>

            <!-- Fish tail decorative point on right -->
            <path d="M 350 180 Q 380 175 395 185 Q 380 195 350 190"
                  fill="#A67C52"/>

            <!-- Subtle edge highlight -->
            <path d="M 80 130 Q 120 90 180 70 Q 250 55 310 90"
                  fill="none"
                  stroke="#E8C9A0"
                  stroke-width="1"
                  opacity="0.3"/>
          </svg>

          <!-- Ripple effect -->
          <div class="ripple" id="ripple"></div>

          <!-- Mallet (木鱼棒) -->
          <svg class="mallet" id="mallet" viewBox="0 0 80 350" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="malletHandle" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#8B6914"/>
                <stop offset="30%" style="stop-color:#C49A6C"/>
                <stop offset="50%" style="stop-color:#E8C9A0"/>
                <stop offset="70%" style="stop-color:#C49A6C"/>
                <stop offset="100%" style="stop-color:#8B6914"/>
              </linearGradient>
              <linearGradient id="malletHead" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#D4A574"/>
                <stop offset="50%" style="stop-color:#A67C52"/>
                <stop offset="100%" style="stop-color:#8B6914"/>
              </linearGradient>
            </defs>

            <!-- Handle (long and slender) -->
            <rect x="35" y="100" width="10" height="230" rx="3" fill="url(#malletHandle)"/>

            <!-- Handle wood grain -->
            <g stroke="#8B6914" stroke-width="0.5" opacity="0.3">
              <line x1="37" y1="110" x2="37" y2="320"/>
              <line x1="43" y1="110" x2="43" y2="320"/>
            </g>

            <!-- Mallet head (egg-shaped, smooth) -->
            <ellipse cx="40" cy="60" rx="30" ry="50" fill="url(#malletHead)" filter="drop-shadow(0 3px 5px rgba(0,0,0,0.4))"/>

            <!-- Head highlight -->
            <ellipse cx="35" cy="45" rx="15" ry="25" fill="#E8C9A0" opacity="0.3"/>

            <!-- Neck connection -->
            <path d="M 32 100 Q 40 95 48 100 L 46 110 Q 40 105 34 110 Z" fill="#A67C52"/>
          </svg>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-card">
            <div id="total-count" class="stat-value">0</div>
            <div class="stat-label">累计敲击</div>
          </div>
          <div class="stat-card">
            <div id="total-merit" class="stat-value">0</div>
            <div class="stat-label">累积功德</div>
          </div>
          <div class="stat-card">
            <div id="session-taps" class="stat-value">0</div>
            <div class="stat-label">本次敲击</div>
          </div>
        </div>

        <!-- Leaderboard -->
        <div class="card" style="margin-top: 2rem;">
          <h3 style="color: var(--color-gold); font-family: var(--font-heading); margin-bottom: 1rem;">
            功德榜 // MERIT RANK
          </h3>
          <div id="leaderboard-list">
            <div style="text-align: center; color: var(--text-muted);">加载中...</div>
          </div>
        </div>

        <!-- Achievements preview -->
        <div class="card" style="margin-top: 2rem;">
          <h3 style="color: var(--color-secondary); font-family: var(--font-heading); margin-bottom: 1rem;">
            成就 // ACHIEVEMENTS
          </h3>
          <div style="display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap;">
            <div class="achievement" data-id="first_tap" style="text-align: center; opacity: 0.4;">
              <div style="font-size: 2rem;">🎯</div>
              <div style="color: var(--text-muted); font-size: 0.8rem;">首次敲击</div>
            </div>
            <div class="achievement" data-id="tap_108" style="text-align: center; opacity: 0.4;">
              <div style="font-size: 2rem;">🔔</div>
              <div style="color: var(--text-muted); font-size: 0.8rem;">敲满108</div>
            </div>
            <div class="achievement" data-id="tap_1000" style="text-align: center; opacity: 0.4;">
              <div style="font-size: 2rem;">⚡</div>
              <div style="color: var(--text-muted); font-size: 0.8rem;">敲击千次</div>
            </div>
            <div class="achievement" data-id="tap_10000" style="text-align: center; opacity: 0.4;">
              <div style="font-size: 2rem;">🌟</div>
              <div style="color: var(--text-muted); font-size: 0.8rem;">功德圆满</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Quick tap button (floating) -->
  <button id="quick-tap" class="quick-tap-btn" style="display: none;">敲</button>

  <footer class="footer">
    <p>赛博上香 // <span>CYBER.ALTAR</span> // 让功德运行在边缘节点</p>
  </footer>

  <script>
    
    let sessionTaps = 0;
    let sessionMerit = 0;
    let currentProgress = 0;

    // Check auth
    async function checkAuth() {
      const res = await fetch('/api/auth/me');
      if (res.ok) {
        const data = await res.json();
        document.getElementById('nav-user').innerHTML = `
          <a href="/me" class="nav-link"><span class="username">${escapeHtml(data.user.username)}</span></a>
          <button class="btn" onclick="logout()" style="padding: 0.4rem 0.8rem; font-size: 0.75rem;">登出</button>
        `;
        document.getElementById('woodfish-interface').style.display = 'block';
        document.getElementById('quick-tap').style.display = 'block';
        loadMyData();
        loadLeaderboard();
      } else {
        document.getElementById('login-required').style.display = 'block';
      }
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/';
    }

    

// Woodfish click handler
    document.getElementById('woodfish-body').addEventListener('click', () => doTap());
    document.getElementById('quick-tap').addEventListener('click', () => doTap());

    async function doTap() {
      const wrapper = document.getElementById('woodfish-wrapper');
      const body = document.getElementById('woodfish-body');
      const mallet = document.getElementById('mallet');
      const ripple = document.getElementById('ripple');

      // Make mallet visible and trigger strike animation
      mallet.classList.add('visible');
      mallet.classList.remove('striking');
      void mallet.offsetWidth; // Trigger reflow
      mallet.classList.add('striking');

      // Woodfish shake animation
      body.classList.remove('shake', 'hit');
      void body.offsetWidth;
      body.classList.add('shake', 'hit');
      setTimeout(() => body.classList.remove('hit'), 200);

      // Ripple effect
      ripple.classList.remove('active');
      void ripple.offsetWidth;
      ripple.classList.add('active');

      try {
        const res = await fetch('/api/woodfish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ count: 1 })
        });

        const data = await res.json();

        if (res.ok) {
          // Update stats
          document.getElementById('total-count').textContent = data.data.total_count;
          document.getElementById('total-merit').textContent = data.data.total_merit;
          sessionTaps += 1;
          sessionMerit += data.data.merit;
          document.getElementById('session-taps').textContent = sessionTaps;

          // Update progress
          currentProgress = data.data.total_count % 108;
          document.getElementById('current-progress').textContent = currentProgress;
          document.getElementById('progress-fill').style.width = (currentProgress / 108 * 100) + '%';

          // Show combo for milestone taps
          if (sessionTaps === 108 || sessionTaps === 1000 || sessionTaps === 10000) {
            showCombo(sessionTaps, data.data.merit);
          }

          // Show merit float
          showMeritFloat(data.data.merit);

          // Round complete celebration
          if (data.data.round_complete > 0) {
            setTimeout(() => {
              showToast(`🎉 完成 ${data.data.round_complete} 轮! +${data.data.round_complete * 10} 功德加成`, 'success');
            }, 500);
          }

          // Achievements
          if (data.data.achievements && data.data.achievements.length > 0) {
            const achievementNames = {
              first_tap: '首次敲击',
              tap_108: '敲满108',
              tap_1000: '敲击千次',
              tap_10000: '功德圆满'
            };
            setTimeout(() => {
              const achieved = data.data.achievements.map(a => achievementNames[a]).join(', ');
              showToast(`🏆 成就解锁: ${achieved}`, 'success');
            }, 1000);
          }
        } else {
          showToast(data.error || '敲击失败', 'error');
        }
      } catch (e) {
        showToast('网络错误', 'error');
      }
    }

    function showCombo(count, merit) {
      const combo = document.getElementById('combo-display');
      combo.textContent = `+${count}`;
      combo.classList.remove('show');
      void combo.offsetWidth;
      combo.classList.add('show');
    }

    function showMeritFloat(merit) {
      const wrapper = document.getElementById('woodfish-wrapper');
      const float = document.createElement('div');
      float.className = 'merit-float';
      float.textContent = `+${merit}`;
      float.style.left = (Math.random() * 100 + 50) + 'px';
      float.style.top = '50%';
      wrapper.appendChild(float);
      setTimeout(() => float.remove(), 1000);
    }

    async function loadMyData() {
      try {
        const res = await fetch('/api/woodfish/my');
        const data = await res.json();

        document.getElementById('total-count').textContent = data.total_count || 0;
        document.getElementById('total-merit').textContent = data.total_merit || 0;

        currentProgress = (data.total_count || 0) % 108;
        document.getElementById('current-progress').textContent = currentProgress;
        document.getElementById('progress-fill').style.width = (currentProgress / 108 * 100) + '%';

        // Update achievements
        const achievements = data.achievements || {};
        Object.keys(achievements).forEach(key => {
          if (achievements[key]) {
            const el = document.querySelector(`.achievement[data-id="${key}"]`);
            if (el) {
              el.style.opacity = '1';
              el.style.borderBottom = '2px solid var(--color-gold)';
            }
          }
        });
      } catch (e) {
        console.error(e);
      }
    }

    async function loadLeaderboard() {
      try {
        const res = await fetch('/api/woodfish/leaderboard');
        const data = await res.json();

        if (data.leaderboard && data.leaderboard.length > 0) {
          const list = document.getElementById('leaderboard-list');
          list.innerHTML = data.leaderboard.map((item, i) => `
            <div style="display: flex; align-items: center; padding: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.1);">
              <span style="width: 30px; color: ${i < 3 ? 'var(--color-gold)' : 'var(--text-muted)'}; font-family: var(--font-mono);">#${i + 1}</span>
              <span style="flex: 1; color: var(--text-primary);">${escapeHtml(item.username)}</span>
              <span style="color: var(--color-gold); font-family: var(--font-mono);">${item.merit} 功德</span>
            </div>
          `).join('');
        } else {
          document.getElementById('leaderboard-list').innerHTML = '<div style="text-align: center; color: var(--text-muted);">暂无记录</div>';
        }
      } catch (e) {
        document.getElementById('leaderboard-list').innerHTML = '<div style="text-align: center; color: var(--text-muted);">加载失败</div>';
      }
    }

    function showToast(msg, type) {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Keyboard shortcut: Space to tap
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.getElementById('woodfish-interface').style.display !== 'none') {
        e.preventDefault();
        doTap();
      }
    });

    checkAuth();
  </script>
